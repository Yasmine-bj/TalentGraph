name: talentgraph

services:


  postgres:
    image: postgres:16
    # ${X:-talentgraph} : la valeur du fichier .env S'IL EXISTE, sinon
    # "talentgraph". Le correcteur peut ainsi lancer le projet SANS .env
    # (git clone, puis docker compose up). Valeurs par défaut réservées à la
    # démo LOCALE : sur le serveur, un .env avec un mot de passe fort.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentgraph}
      POSTGRES_DB: ${POSTGRES_DB:-talentgraph}
    ports:
       # port_du_PC:port_du_conteneur
      # 5433 côté PC : le port 5432 est déjà pris par un PostgreSQL installé
      # sur Windows. Dans le conteneur et dans le réseau Docker, ça reste 5432.
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data # volume pour les données de la base de données
      # Scripts SQL d'initialisation (création des tables).
      # Le dossier du projet est "monté" dans le dossier spécial
      # /docker-entrypoint-initdb.d/ : au PREMIER démarrage (volume pg_data
      # vide), PostgreSQL exécute les .sql qu'il contient, par ordre alphabétique.
      # :ro (read-only) : le conteneur peut lire ces fichiers, pas les modifier.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Scripts SQL d'initialisation (création des tables).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentgraph} -d ${POSTGRES_DB:-talentgraph}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  # ---------------------------------------------------------------
  # Redis : base clé-valeur en mémoire
  # Rôle dans TalentGraph : cache des réponses LLM, file de tâches
  # pour le worker, statut des agents en direct, statistiques.
  # ---------------------------------------------------------------
  redis:
    # Image officielle Redis, version majeure 7 (fixée pour la reproductibilité)
    image: redis:7

    # Remplace la commande de démarrage par défaut.
    # --appendonly yes active le mode AOF : chaque écriture est notée
    # dans un journal sur disque (/data), relu au redémarrage.
    # Sans ça, Redis ne sauvegarde que des "photos" périodiques (RDB)
    # et peut perdre les dernières écritures.
    command: ["redis-server", "--appendonly", "yes"]

    # port_du_PC:port_du_conteneur
    # Permet de se connecter depuis ta machine sur localhost:6379.
    # Dans le réseau Docker, les autres services utiliseront redis:6379.
    ports:
      - "6379:6379"

    # Volume nommé branché sur /data, le dossier où Redis écrit
    # son journal AOF. Les données survivent à la suppression du conteneur.
    volumes:
      - redis_data:/data

    # Test de disponibilité : redis-cli ping doit répondre PONG.
    # Format liste avec "CMD" : la commande est lancée directement,
    # sans passer par un shell (pas besoin de variables ici).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s     # un test toutes les 5 secondes
      timeout: 3s      # un test qui dure plus de 3 s compte comme un échec
      retries: 10      # après 10 échecs d'affilée : "unhealthy"

    # Relance automatique en cas de plantage, sauf arrêt manuel.
    restart: unless-stopped
  
  # ---------------------------------------------------------------
  # Elasticsearch : moteur de recherche (base NoSQL orientée documents)
  # Rôle dans TalentGraph : index des offres pour la recherche hybride
  # (BM25 + vecteurs), les filtres et les agrégations du mode 2.
  # PostgreSQL reste la source de vérité ; cet index se reconstruit.
  # ---------------------------------------------------------------
  elasticsearch:
    # Image officielle, hébergée sur le registre d'Elastic (pas Docker Hub).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.6

    environment:
      # Un seul nœud : ne pas chercher d'autres machines du cluster.
      discovery.type: single-node
      # Sécurité (mot de passe, HTTPS) désactivée EN LOCAL uniquement.
      xpack.security.enabled: "false"
      # Mémoire Java (heap) fixée à 1 Go : minimum = maximum.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    # API REST d'Elasticsearch : http://localhost:9200 depuis ton PC,
    # http://elasticsearch:9200 depuis les autres conteneurs.
    ports:
      - "9200:9200"

    # Dossier où Elasticsearch stocke ses index.
    volumes:
      - es_data:/usr/share/elasticsearch/data

    # Prêt quand la route _cluster/health répond.
    # curl -f échoue si la réponse est une erreur HTTP.
    # Elasticsearch met 20 à 60 s à démarrer, d'où plus de tentatives.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  # ---------------------------------------------------------------
  # Loader : remplit les bases au premier démarrage (livraison, D10)
  # Charge seed/demo_offers.json dans PostgreSQL et construit l'index
  # Elasticsearch (embeddings compris) SI c'est nécessaire, puis s'arrête.
  # Chez nous (bases déjà pleines) : ne fait rien, s'arrête en 1 seconde.
  # ---------------------------------------------------------------
  loader:
    # Contexte = la RACINE du projet (pour copier infra/ et seed/ dans
    # l'image) ; le Dockerfile reste rangé dans worker/.
    # Ce qui entre dans le contexte : voir .dockerignore (liste blanche).
    build:
      context: .
      dockerfile: worker/Dockerfile

    # Mêmes paramètres de connexion que l'API (noms des services Docker).
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-talentgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentgraph}
      POSTGRES_DB: ${POSTGRES_DB:-talentgraph}
      ES_URL: http://elasticsearch:9200

    # Même cache Hugging Face que l'API : le modèle (~470 Mo) est
    # téléchargé UNE fois, par le loader, et l'API le retrouve déjà là.
    volumes:
      - hf_cache:/root/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    # Un travail qui se TERMINE : on ne le relance pas après sa fin
    # (contrairement aux bases et à l'API, qui tournent en continu).
    restart: "no"

  # ---------------------------------------------------------------
  # API : notre serveur FastAPI (module M3)
  # Rôle : faire le lien entre l'interface web et les trois bases.
  # Image construite à partir de api/Dockerfile (notre code).
  # ---------------------------------------------------------------
  api:
    # Construire l'image à partir du dossier api/ (qui contient le Dockerfile),
    # au lieu de télécharger une image toute prête comme pour les bases.
    build: ./api

    # Variables lues par api/app/db.py.
    # Dans le réseau Docker, chaque base se joint par le NOM DE SON SERVICE,
    # sur son port INTERNE (5432 pour PostgreSQL, pas le 5433 de ton PC).
    # ${...} : valeurs lues dans le fichier .env (les secrets ne sont pas ici).
    # ${X:-talentgraph} : valeur PAR DÉFAUT si .env est absent (voir postgres).
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-talentgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentgraph}
      POSTGRES_DB: ${POSTGRES_DB:-talentgraph}
      REDIS_HOST: redis
      ES_URL: http://elasticsearch:9200

    # Cache Hugging Face : le modèle d'embeddings (~470 Mo) est téléchargé au
    # PREMIER usage dans ce dossier. Grâce au volume, il est gardé quand le
    # conteneur est recréé (docker compose up --build) : pas de nouveau
    # téléchargement à chaque fois.
    volumes:
      - hf_cache:/root/.cache/huggingface

    # port_du_PC:port_du_conteneur -> http://localhost:8000 depuis ton navigateur.
    ports:
      - "8000:8000"

    # Ne démarrer l'API que lorsque les trois bases sont PRÊTES (healthy),
    # pas seulement démarrées : évite les erreurs pendant que
    # Elasticsearch démarre (20 à 60 s).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      # L'API démarre seulement quand le loader a TERMINÉ AVEC SUCCÈS
      # (code de sortie 0) : quand le formulaire est accessible, les
      # offres sont forcément dans les bases.
      loader:
        condition: service_completed_successfully

    # L'API est "healthy" si sa route /health répond 200.
    # Lancé DANS le conteneur : ici, localhost = le conteneur api lui-même.
    # L'image python:slim n'a pas curl : on utilise Python. urlopen lève une
    # erreur si le code n'est pas 200 (ex. 503) -> conteneur "unhealthy".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  pg_data:
  redis_data:   # journal AOF de Redis
  es_data:      # index Elasticsearch
  hf_cache:     # modèle d'embeddings téléchargé par l'API (M4)
