name: talentgraph

services:


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  # ---------------------------------------------------------------
  # Redis : base clé-valeur en mémoire
  # Rôle dans TalentGraph : cache des réponses LLM, file de tâches
  # pour le worker, statut des agents en direct, statistiques.
  # ---------------------------------------------------------------
  redis:
    # Image officielle Redis, version majeure 7 (fixée pour la reproductibilité)
    image: redis:7

    # Remplace la commande de démarrage par défaut.
    # --appendonly yes active le mode AOF : chaque écriture est notée
    # dans un journal sur disque (/data), relu au redémarrage.
    # Sans ça, Redis ne sauvegarde que des "photos" périodiques (RDB)
    # et peut perdre les dernières écritures.
    command: ["redis-server", "--appendonly", "yes"]

    # port_du_PC:port_du_conteneur
    # Permet de se connecter depuis ta machine sur localhost:6379.
    # Dans le réseau Docker, les autres services utiliseront redis:6379.
    ports:
      - "6379:6379"

    # Volume nommé branché sur /data, le dossier où Redis écrit
    # son journal AOF. Les données survivent à la suppression du conteneur.
    volumes:
      - redis_data:/data

    # Test de disponibilité : redis-cli ping doit répondre PONG.
    # Format liste avec "CMD" : la commande est lancée directement,
    # sans passer par un shell (pas besoin de variables ici).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s     # un test toutes les 5 secondes
      timeout: 3s      # un test qui dure plus de 3 s compte comme un échec
      retries: 10      # après 10 échecs d'affilée : "unhealthy"

    # Relance automatique en cas de plantage, sauf arrêt manuel.
    restart: unless-stopped
  
  # ---------------------------------------------------------------
  # Elasticsearch : moteur de recherche (base NoSQL orientée documents)
  # Rôle dans TalentGraph : index des offres pour la recherche hybride
  # (BM25 + vecteurs), les filtres et les agrégations du mode 2.
  # PostgreSQL reste la source de vérité ; cet index se reconstruit.
  # ---------------------------------------------------------------
  elasticsearch:
    # Image officielle, hébergée sur le registre d'Elastic (pas Docker Hub).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.6

    environment:
      # Un seul nœud : ne pas chercher d'autres machines du cluster.
      discovery.type: single-node
      # Sécurité (mot de passe, HTTPS) désactivée EN LOCAL uniquement.
      xpack.security.enabled: "false"
      # Mémoire Java (heap) fixée à 1 Go : minimum = maximum.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    # API REST d'Elasticsearch : http://localhost:9200 depuis ton PC,
    # http://elasticsearch:9200 depuis les autres conteneurs.
    ports:
      - "9200:9200"

    # Dossier où Elasticsearch stocke ses index.
    volumes:
      - es_data:/usr/share/elasticsearch/data

    # Prêt quand la route _cluster/health répond.
    # curl -f échoue si la réponse est une erreur HTTP.
    # Elasticsearch met 20 à 60 s à démarrer, d'où plus de tentatives.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped

volumes:
  pg_data:
  redis_data:   # journal AOF de Redis
  es_data:      # index Elasticsearch