# =============================================================================
# nginx.conf — Le serveur web du conteneur frontend (production)
#
# Deux rôles :
#   1. envoyer la page React construite par Vite (index.html, .js, .css) ;
#   2. REVERSE PROXY : transmettre les requêtes /api/... au conteneur api.
#      La page et l'API ont ainsi la même adresse (pas de blocage CORS).
# =============================================================================

server {
    listen 80;                       # port DANS le conteneur ("3000:80" dans le compose)
    server_name _;                   # n'importe quel nom de domaine

    root /usr/share/nginx/html;      # les fichiers de dist/ (copiés par le Dockerfile)
    index index.html;

    # 2. /api/... -> conteneur api, port 8000 ("api" = nom du service Docker,
    #    résolu par le réseau interne de Docker Compose).
    location /api/ {
        proxy_pass http://api:8000;
        # Transmettre à l'API l'adresse d'origine de la requête (logs, sécurité).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers construits par Vite : leur nom contient un code (index-a1b2c3.js)
    # qui change à chaque version -> le navigateur peut les garder en cache 1 an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 1. Tout le reste : le fichier demandé s'il existe, sinon index.html
    #    (l'application React gère elle-même l'affichage).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
