# frontend/nginx.conf — configuration de nginx dans le conteneur frontend.
#
# nginx joue DEUX rôles :
#   1. serveur de fichiers : il envoie index.html, le JS et le CSS de dist/ ;
#   2. REVERSE PROXY : les requêtes /api/... sont transmises au conteneur "api".
#      Le navigateur ne parle qu'à UNE adresse (localhost:3000, ou l'IP du
#      serveur) : pas de CORS, et l'API n'a pas besoin d'être exposée.
#      (C'est le rôle que joue le proxy de Vite en développement.)

server {
    listen 80;              # port DANS le conteneur
    server_name _;          # "_" = répondre quel que soit le nom de domaine

    root /usr/share/nginx/html;   # là où le Dockerfile a copié dist/
    index index.html;

    # --- 1) L'API : tout ce qui commence par /api/ ---
    location /api/ {
        # "api" = le NOM DU SERVICE dans docker-compose.yml : le DNS interne de
        # Docker le traduit en l'adresse IP du conteneur (jamais d'IP en dur).
        # Sans chemin après le port, l'URL est transmise TELLE QUELLE :
        # /api/searches/42 → http://api:8000/api/searches/42
        proxy_pass http://api:8000;

        # On transmet à l'API le nom d'hôte d'origine et l'IP du visiteur
        # (sinon, l'API verrait toutes les requêtes venir de nginx).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 2) Les fichiers produits par Vite (JS, CSS) ---
    # Leur nom contient une empreinte (ex. index-BimmrtKe.js) qui change à chaque
    # build : le navigateur peut les garder en cache 1 an sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- 3) Tout le reste : l'application React (SPA) ---
    # /resultats/42 n'existe PAS en tant que fichier : c'est React Router qui
    # gère cette URL dans le navigateur. try_files essaie le fichier demandé,
    # puis un dossier, et sinon renvoie index.html : React affiche la bonne page.
    # Sans cette ligne, un rechargement (F5) sur /resultats/42 donnerait une 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
